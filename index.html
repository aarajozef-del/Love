<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0014" />
<title>💌 یه نامه برات دارم</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --pink:        #ff6b9d;
    --deep-pink:   #b83068;
    --hot-pink:    #ff3d7f;
    --rose:        #ffc2d6;
    --gold:        #ffd77a;
    --ink:         #3a1020;
    --bg-1:        #1a0524;
    --bg-2:        #0a0014;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: 'Vazirmatn', system-ui, sans-serif;
    background: var(--bg-2);
    color: #fff;
    overflow-x: hidden;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
    padding: 24px;
  }

  .bg-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

  .bg-gradient {
    background:
      radial-gradient(ellipse at 20% 20%, rgba(255, 61, 127, .22) 0%, transparent 45%),
      radial-gradient(ellipse at 80% 30%, rgba(184, 48, 104, .25) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 90%, rgba(255, 107, 157, .18) 0%, transparent 55%),
      radial-gradient(circle at 50% 50%, var(--bg-1) 0%, var(--bg-2) 75%);
    animation: bgBreathe 8s ease-in-out infinite;
  }
  @keyframes bgBreathe {
    0%,100% { filter: brightness(1); }
    50%     { filter: brightness(1.15); }
  }

  .bg-grid {
    background-image:
      linear-gradient(rgba(255, 107, 157, .045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 107, 157, .045) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    animation: gridShift 60s linear infinite;
  }
  @keyframes gridShift { to { background-position: 46px 46px, 46px 46px; } }

  .bg-leaves { overflow: hidden; }
  .falling-leaf {
    position: absolute;
    top: -60px;
    font-size: 24px;
    opacity: 0;
    will-change: transform, opacity;
    animation: leafFall linear forwards;
    filter: drop-shadow(0 0 8px rgba(255, 107, 157, .5));
    user-select: none;
  }
  @keyframes leafFall {
    0% { transform: translateY(0) translateX(0) rotate(0deg) scale(.6); opacity: 0; }
    8% { opacity: .9; }
    50% { transform: translateY(50vh) translateX(var(--sway)) rotate(180deg) scale(1); }
    92% { opacity: .6; }
    100% { transform: translateY(105vh) translateX(calc(var(--sway) * -1)) rotate(540deg) scale(.8); opacity: 0; }
  }

  .bg-particles { overflow: hidden; }
  .particle {
    position: absolute;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--rose);
    box-shadow: 0 0 6px var(--pink), 0 0 12px var(--pink);
    opacity: 0;
    animation: particleFloat linear infinite;
  }
  @keyframes particleFloat {
    0%   { transform: translateY(0) scale(.4); opacity: 0; }
    15%  { opacity: .9; }
    85%  { opacity: .6; }
    100% { transform: translateY(-110vh) scale(1); opacity: 0; }
  }

  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: .4;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity: .15; transform: scale(.7); }
    50%     { opacity: .95; transform: scale(1.3); }
  }

  .bg-butterflies { overflow: hidden; }
  .butterfly {
    position: absolute;
    font-size: 18px;
    opacity: 0;
    animation: butterflyPath linear forwards;
    filter: drop-shadow(0 0 8px rgba(255, 107, 157, .6));
    user-select: none;
  }
  @keyframes butterflyPath {
    0% { transform: translate(0, 0) rotate(0deg) scale(.8); opacity: 0; }
    10% { opacity: .9; }
    25% { transform: translate(60px, -30px) rotate(15deg) scale(1); }
    50% { transform: translate(-40px, -80px) rotate(-20deg) scale(1.1); }
    75% { transform: translate(80px, -130px) rotate(25deg) scale(1); }
    90% { opacity: .7; }
    100% { transform: translate(20px, -180vh) rotate(-30deg) scale(.7); opacity: 0; }
  }

  .cursor-glow {
    position: fixed;
    width: 420px; height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 107, 157, .18) 0%, transparent 65%);
    pointer-events: none;
    z-index: 1;
    transform: translate(-50%, -50%);
    mix-blend-mode: screen;
    filter: blur(20px);
  }

  .stage {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 34px;
    text-align: center;
    animation: stageIn 1.4s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes stageIn {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .title-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }

  .title {
    margin: 0;
    font-family: 'Amiri', 'Vazirmatn', serif;
    font-size: clamp(24px, 7vw, 44px);
    font-weight: 700;
    line-height: 1.4;
    background: linear-gradient(120deg, #fff 0%, var(--gold) 30%, var(--pink) 50%, var(--gold) 70%, #fff 100%);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 6s ease-in-out infinite;
    letter-spacing: 1px;
    filter: drop-shadow(0 0 25px rgba(255, 107, 157, .55));
    min-height: 1.4em;
  }
  @keyframes shimmer {
    0%,100% { background-position: 0% 50%; }
    50%     { background-position: 100% 50%; }
  }

  .caret {
    display: inline-block;
    width: 3px;
    height: .95em;
    background: var(--pink);
    margin-right: 4px;
    vertical-align: -2px;
    animation: caret 1s steps(1) infinite;
    box-shadow: 0 0 10px var(--pink);
    border-radius: 2px;
  }
  @keyframes caret { 50% { opacity: 0; } }

  .title-sub {
    margin: 0;
    font-family: 'Great Vibes', 'Amiri', cursive;
    font-size: clamp(16px, 4vw, 22px);
    color: var(--rose);
    letter-spacing: 2px;
    opacity: .85;
    text-shadow: 0 0 18px rgba(255, 107, 157, .5);
  }

  .deco-line { display: flex; align-items: center; gap: 12px; opacity: .65; }
  .deco-line::before, .deco-line::after {
    content: '';
    width: 50px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--pink), transparent);
  }
  .deco-line span { font-size: 12px; color: var(--pink); letter-spacing: 8px; }

  .envelope-wrap { position: relative; perspective: 1600px; padding: 20px; }

  .envelope {
    position: relative;
    width: min(360px, 84vw);
    height: min(244px, 57vw);
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform .45s cubic-bezier(.2,.8,.3,1);
    animation: floatEnv 5s ease-in-out infinite;
    filter:
      drop-shadow(0 0 42px rgba(255, 61, 127, .45))
      drop-shadow(0 30px 60px rgba(0, 0, 0, .7));
  }
  @keyframes floatEnv {
    0%,100% { transform: translateY(0) rotateZ(0); }
    50%     { transform: translateY(-10px) rotateZ(-.6deg); }
  }
  .envelope:hover {
    transform: translateY(-8px) scale(1.035) rotateZ(.4deg);
    animation-play-state: paused;
  }
  .envelope.open { animation: none; cursor: default; }

  .envelope::after {
    content: '';
    position: absolute;
    inset: -30px;
    background: radial-gradient(circle, rgba(255, 107, 157, .4) 0%, transparent 65%);
    border-radius: 50%;
    z-index: -1;
    opacity: .8;
    animation: haloPulse 3s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes haloPulse {
    0%,100% { opacity: .55; transform: scale(1); }
    50%     { opacity: .95; transform: scale(1.08); }
  }

  .envelope-body {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg, rgba(255,255,255,.08), transparent 40%),
      linear-gradient(135deg, #a02a5b 0%, #6d1740 55%, #4a0f2b 100%);
    border-radius: 14px;
    z-index: 1;
  }

  .letter-peek {
    position: absolute;
    left: 5%;
    width: 90%;
    bottom: 8%;
    height: 80%;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,.4), transparent 60%),
      linear-gradient(180deg, #fffdf8, #ffeef3);
    border-radius: 8px;
    z-index: 3;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 16px;
    font-size: 22px;
    color: var(--deep-pink);
    box-shadow:
      0 -8px 24px rgba(0, 0, 0, .35),
      0 0 0 1px rgba(255, 255, 255, .5);
    transition: transform .8s cubic-bezier(.5,0,.6,1) 0s;
    overflow: hidden;
  }
  .letter-peek::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      180deg,
      transparent 0px, transparent 22px,
      rgba(255, 107, 157, .08) 23px, transparent 24px
    );
    pointer-events: none;
  }
  .envelope.open .letter-peek {
    transform: translateY(-66%);
    transition: transform 1.1s cubic-bezier(.2,.8,.3,1) .35s;
    z-index: 7;
  }
  .envelope:not(.open) .letter-peek {
    transform: translateY(0);
    transition: transform .7s cubic-bezier(.5,0,.6,1) .3s, z-index 0s .35s;
  }

  .flap {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 52%;
    background: linear-gradient(180deg, #ff7ba7 0%, #e5608e 40%, #b83068 100%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform .7s cubic-bezier(.6,.05,.3,1) .5s;
    z-index: 5;
    border-radius: 14px 14px 0 0;
  }
  .envelope.open .flap {
    transform: rotateX(-180deg);
    z-index: 0;
    transition: transform 1s cubic-bezier(.6,.05,.3,1) 0s;
  }
  .envelope:not(.open) .flap {
    transform: rotateX(0deg);
    transition: transform .7s cubic-bezier(.6,.05,.3,1) .5s;
  }

  .front {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #d4527f 0%, #96234f 70%, #6d1740 100%);
    border-radius: 14px;
    clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%);
    z-index: 4;
    box-shadow: inset 0 -6px 16px rgba(0,0,0,.35);
  }
  .front::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg, transparent 48.5%, rgba(255,255,255,.1) 49.5%, rgba(255,255,255,.1) 50.5%, transparent 51.5%),
      linear-gradient(-135deg, transparent 48.5%, rgba(255,255,255,.1) 49.5%, rgba(255,255,255,.1) 50.5%, transparent 51.5%);
    border-radius: 14px;
  }

  .seal {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 62px; height: 62px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, #ff8fb0, #ff3d7f 45%, #b83068 90%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 30px;
    z-index: 6;
    box-shadow:
      0 10px 30px rgba(255, 60, 120, .65),
      0 0 0 3px rgba(255, 255, 255, .2),
      0 0 0 6px rgba(255, 61, 127, .25),
      inset 0 -3px 12px rgba(0,0,0,.3),
      inset 0 3px 10px rgba(255,255,255,.35);
    transition: opacity .5s, transform .7s cubic-bezier(.4,0,.6,1);
    animation: sealPulse 2.2s ease-in-out infinite;
  }
  .seal::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 1px dashed rgba(255, 255, 255, .35);
    animation: sealSpin 12s linear infinite;
  }
  @keyframes sealSpin { to { transform: rotate(360deg); } }
  @keyframes sealPulse {
    0%,100% {
      box-shadow:
        0 10px 30px rgba(255, 60, 120, .65),
        0 0 0 3px rgba(255, 255, 255, .2),
        0 0 0 6px rgba(255, 61, 127, .25),
        inset 0 -3px 12px rgba(0,0,0,.3),
        inset 0 3px 10px rgba(255,255,255,.35);
    }
    50% {
      box-shadow:
        0 10px 34px rgba(255, 60, 120, .85),
        0 0 0 3px rgba(255, 255, 255, .3),
        0 0 0 18px rgba(255, 61, 127, 0),
        inset 0 -3px 12px rgba(0,0,0,.3),
        inset 0 3px 10px rgba(255,255,255,.35);
    }
  }
  .envelope.open .seal {
    opacity: 0;
    transform: translate(-50%, -50%) scale(.2) rotate(320deg);
    pointer-events: none;
  }

  .hint {
    margin: 0;
    font-size: clamp(12px, 3.4vw, 14.5px);
    color: var(--rose);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 22px;
    border-radius: 999px;
    background: rgba(255, 107, 157, .08);
    border: 1px solid rgba(255, 107, 157, .3);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: opacity .4s, transform .4s;
    animation: hintPulse 2.4s ease-in-out infinite;
    letter-spacing: .4px;
  }
  @keyframes hintPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(255, 107, 157, .35); opacity: .85; }
    50%     { box-shadow: 0 0 22px 4px rgba(255, 107, 157, .35); opacity: 1; }
  }
  .hint.hidden {
    opacity: 0;
    transform: translateY(12px);
    pointer-events: none;
    animation: none;
  }
  .hint .spark { display: inline-block; animation: sparkSpin 3s linear infinite; }
  @keyframes sparkSpin { to { transform: rotate(360deg); } }

  .sound-wave {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    height: 14px;
    margin-right: 4px;
    opacity: 0;
    transition: opacity .3s;
  }
  .sound-wave.active { opacity: 1; }
  .sound-wave span {
    width: 2px; height: 4px;
    background: var(--pink);
    border-radius: 1px;
    box-shadow: 0 0 6px var(--pink);
    animation: waveBounce 1s ease-in-out infinite;
  }
  .sound-wave span:nth-child(1) { animation-delay: 0s; }
  .sound-wave span:nth-child(2) { animation-delay: .15s; }
  .sound-wave span:nth-child(3) { animation-delay: .3s; }
  .sound-wave span:nth-child(4) { animation-delay: .45s; }
  @keyframes waveBounce {
    0%,100% { height: 4px; }
    50%     { height: 14px; }
  }

  .burst-heart {
    position: fixed;
    z-index: 200;
    pointer-events: none;
    text-shadow:
      0 0 10px rgba(255,107,157,.9),
      0 0 22px rgba(255,61,127,.7);
    animation: burst 1.8s cubic-bezier(.15,.7,.35,1) forwards;
    will-change: transform, opacity;
  }
  @keyframes burst {
    0% { transform: translate(-50%, -50%) scale(.3) rotate(0deg); opacity: 1; }
    100% {
      transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty)))
        scale(1.4) rotate(var(--rot));
      opacity: 0;
    }
  }

  .letter-modal {
    position: fixed;
    inset: 0;
    background: rgba(5, 1, 10, .35);
    backdrop-filter: blur(3px) saturate(1.2);
    -webkit-backdrop-filter: blur(3px) saturate(1.2);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity .65s ease;
    overflow: hidden;
  }
  .letter-modal.show {
    opacity: 1;
    pointer-events: auto;
  }

  .letter-paper {
    position: relative;
    width: min(520px, 92vw);
    max-height: 85vh;
    background:
      radial-gradient(circle at 0% 0%, rgba(255,182,203,.32), transparent 42%),
      radial-gradient(circle at 100% 100%, rgba(255,182,203,.26), transparent 42%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.03), transparent 70%),
      linear-gradient(180deg, #fffdf8 0%, #fff4f7 100%);
    color: var(--ink);
    border-radius: 22px;
    padding: 56px 14px 18px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 40px 90px rgba(0, 0, 0, .65),
      0 0 50px rgba(255, 107, 157, .22),
      0 0 80px rgba(255, 107, 157, .1),
      inset 0 0 80px rgba(255, 182, 203, .12);
    transform: translateY(50px) scale(.9) rotateX(8deg);
    transition: transform .9s cubic-bezier(.2, .9, .3, 1);
    transform-origin: center bottom;
  }
  .letter-modal.show .letter-paper { transform: translateY(0) scale(1) rotateX(0deg); }

  .close-btn {
    position: absolute;
    top: 12px;
    left: 14px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid rgba(255, 107, 157, .5);
    background: linear-gradient(135deg, rgba(255, 107, 157, .95), rgba(184, 48, 104, .95));
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .3s cubic-bezier(.2,.8,.3,1);
    font-family: inherit;
    z-index: 40;
    backdrop-filter: blur(8px);
    box-shadow:
      0 4px 16px rgba(255, 107, 157, .5),
      inset 0 0 12px rgba(255, 255, 255, .3);
  }
  .close-btn:hover {
    background: linear-gradient(135deg, #ff1f5e, #8a1a44);
    transform: rotate(90deg) scale(1.12);
    box-shadow: 0 0 24px rgba(255, 61, 127, .9);
  }
  .close-btn:active { transform: rotate(90deg) scale(.95); }

  .letter-header {
    text-align: center;
    margin-bottom: 14px;
    padding-bottom: 12px;
    position: relative;
    flex-shrink: 0;
  }
  .letter-header::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(184, 48, 104, .5), transparent);
  }

  .ornament {
    font-size: 14px;
    color: var(--pink);
    letter-spacing: 9px;
    margin-bottom: 8px;
    opacity: .9;
    text-shadow: 0 0 14px rgba(255, 107, 157, .6);
  }

  .letter-header h1 {
    margin: 0 0 8px;
    font-family: 'Amiri', 'Vazirmatn', serif;
    font-size: clamp(17px, 4.4vw, 24px);
    font-weight: 700;
    background: linear-gradient(135deg, #b83068 0%, #ff6b9d 45%, #b83068 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.6;
    animation: shimmer 7s ease-in-out infinite;
    filter: drop-shadow(0 2px 8px rgba(255, 107, 157, .35));
  }

  .heart-row {
    font-size: 16px;
    letter-spacing: 5px;
    animation: heartBeat 1.8s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes heartBeat {
    0%,100% { transform: scale(1); }
    20%     { transform: scale(1.12); }
    40%     { transform: scale(1); }
    60%     { transform: scale(1.08); }
  }

  .letter-body {
    position: relative;
    width: 100%;
    height: 42vh;
    min-height: 220px;
    max-height: 380px;
    box-sizing: border-box;
    margin: 0 auto;
    background: rgba(255, 245, 248, .55);
    border-radius: 14px;
    border: 2px solid rgba(255, 143, 176, .85);
    box-shadow: 0 4px 16px rgba(255, 107, 157, .12);
    outline: 1.5px dashed rgba(255, 107, 157, .5);
    outline-offset: -8px;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
    flex: 0 0 auto;
    transform: translateZ(0);
  }

  .letter-inner {
    padding: 28px 20px 22px;
    position: relative;
    min-height: 100%;
    box-sizing: border-box;
  }

  .letter-body::-webkit-scrollbar { width: 6px; }
  .letter-body::-webkit-scrollbar-track {
    background: rgba(255, 107, 157, .05);
    border-radius: 6px;
    margin: 20px 0;
  }
  .letter-body::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #ff9bbd, #d4527f);
    border-radius: 6px;
  }

  .letter-inner::before,
  .letter-inner::after {
    content: '❤';
    position: absolute;
    font-size: 20px;
    color: var(--pink);
    text-shadow:
      0 0 12px rgba(255, 107, 157, .95),
      0 0 20px rgba(255, 61, 127, .65);
    animation: cornerPulse 3s ease-in-out infinite;
    pointer-events: none;
    line-height: 1;
    z-index: 2;
  }
  .letter-inner::before { top: 10px; right: 14px; }
  .letter-inner::after { bottom: 10px; left: 14px; animation-delay: 1.5s; }

  @keyframes cornerPulse {
    0%,100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
    50%     { transform: scale(1.25) rotate(10deg); filter: brightness(1.3); }
  }

  .corner-heart {
    position: absolute;
    font-size: 13px;
    color: var(--pink);
    opacity: .85;
    text-shadow: 0 0 8px rgba(255, 107, 157, .85);
    animation: cornerPulse 3.5s ease-in-out infinite;
    pointer-events: none;
    line-height: 1;
    z-index: 2;
  }
  .corner-heart.tl { top: 10px; left: 14px; animation-delay: .3s; }
  .corner-heart.br { bottom: 10px; right: 14px; animation-delay: 1.8s; }

  .letter-inner p {
    font-size: clamp(13px, 3.5vw, 15px);
    line-height: 2.1;
    margin: 0 0 16px;
    color: #4a2030;
    text-align: right;
    min-height: 1.2em;
    position: relative;
    z-index: 1;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  .letter-inner p:last-child { margin-bottom: 20px; }

  .typing-cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--deep-pink);
    margin-right: 2px;
    vertical-align: -2px;
    animation: caret .7s steps(1) infinite;
    box-shadow: 0 0 6px var(--pink);
    border-radius: 1px;
  }

  .letter-inner p:first-of-type {
    font-size: clamp(13.5px, 3.6vw, 15.5px);
    color: #3a1020;
    font-weight: 500;
    padding-top: 4px;
  }

  .letter-footer {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed rgba(184, 48, 104, .4);
    text-align: center;
    position: relative;
    opacity: 0;
    transition: opacity .8s ease;
    flex-shrink: 0;
  }
  .letter-footer.visible { opacity: 1; }
  .letter-footer::before {
    content: '❤';
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    background: #fffaf4;
    color: var(--deep-pink);
    padding: 0 12px;
    font-size: 12px;
    text-shadow: 0 0 10px rgba(255, 107, 157, .6);
  }

  .signature {
    font-family: 'Amiri', serif;
    font-size: clamp(13px, 3.6vw, 15.5px);
    font-weight: 700;
    color: var(--deep-pink);
    letter-spacing: .5px;
    line-height: 1.8;
  }

  .footer-hearts {
    margin-top: 6px;
    font-size: 15px;
    letter-spacing: 8px;
    animation: heartBeat 2.2s ease-in-out infinite;
    color: var(--hot-pink);
  }

  @media (max-width: 480px) {
    .letter-paper {
      width: min(420px, 94vw);
      max-height: 86vh;
      padding: 52px 10px 16px;
      border-radius: 18px;
    }
    .letter-body {
      height: 46vh;
      min-height: 200px;
      max-height: 380px;
    }
    .letter-inner {
      padding: 22px 14px 18px;
    }
    .letter-inner p { line-height: 2; margin-bottom: 14px; }
    .letter-inner p:last-child { margin-bottom: 16px; }
    .close-btn { width: 36px; height: 36px; top: 10px; left: 10px; font-size: 14px; }
    .cursor-glow { display: none; }
    .seal { width: 54px; height: 54px; font-size: 26px; }
    .letter-inner::before { font-size: 16px; top: 8px; right: 10px; }
    .letter-inner::after { font-size: 16px; bottom: 8px; left: 10px; }
    .corner-heart { font-size: 11px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01s !important; transition-duration: .01s !important; }
  }
</style>
</head>
<body>

          <p data-text="نمی‌دونم از کجا شروع کنم، فقط می‌دونم یه عالمه حرف توی دلمه که شاید هیچ‌وقت نتونم اون‌جوری که باید بهت بگم. نمی‌دونم اصلاً کلمه‌ای هست که بتونه بفهمونت چقدر برام عزیزی یا نه، ولی دلم می‌خواد حداقل یه بار همه‌ی چیزایی که توی قلبمه رو بهت بگم."></p>
          <p data-text="ببین خاهری، بعضی آدما رو خدا یه جوری وارد زندگیت می‌کنه که بعد یه مدت می‌فهمی دیگه فقط یه آدم معمولی نیستن، بلکه تبدیل شدن به یکی از عزیزترین آدمای زندگیت. تو برای من دقیقاً همون آدمی، همون خاهری که با قلبم انتخابش کردم. ❤️🫂"></p>
          <p data-text="خاهری، تو نمی‌دونی چقدر برام مهمی. شاید خودمم نتونم درست توضیح بدم، ولی واقعاً یه جای خاص توی قلبم داری که هیچ‌کس نمی‌تونه انکارش کنه. تو یه آدم خیلی خاص توی زندگیمی، یکی از اون آدمایی که حتی فکر کردن بهشون هم باعث می‌شه آدم لبخند بزنه. شاید خیلی وقتا نتونسته باشم اون‌جوری که باید بهت نشون بدم چقدر دوستت دارم، ولی باور کن هیچ‌وقت به این معنی نبوده که برام کم‌اهمیتی. اتفاقاً بعضی وقتا آدم یه نفر رو انقدر دوست داره که اصلاً نمی‌دونه چجوری باید احساسش رو بهش بگه. تو برای من همون آدمی. 🥹❤️‍🩹"></p>
          <p data-text="می‌دونی چیه؟ من از اینکه تو رو توی زندگیم دارم خوشحالم، واقعاً خوشحالم. شاید به نظر بعضیا عجیب بیاد که آدم بتونه یکی رو این‌قدر خواهر خودش بدونه، ولی من اصلاً برام مهم نیست بقیه چی فکر می‌کنن. من تو رو با قلبم خواهر خودم دونستم و این برای من از خیلی چیزا باارزش‌تره. ❤️"></p>
          <p data-text="تاج سرم، می‌خوام یه چیزی رو همیشه یادت بمونه؛ تو برای من فقط وقتی که خوبی و می‌خندی عزیز نیستی. حتی اگه یه روز حالت خوب نباشه، اگه خسته باشی، اگه دلت گرفته باشه یا حتی حوصله‌ی حرف زدن با هیچ‌کس رو نداشته باشی، بازم همون‌قدر برام عزیزی. لازم نیست همیشه قوی باشی، لازم نیست همیشه بخندی یا وانمود کنی که همه‌چی خوبه. تو هم حق داری خسته بشی، ناراحت بشی و گاهی به یه نفر نیاز داشته باشی که فقط حرفات رو بشنوه. دلم می‌خواد هیچ‌وقت فکر نکنی که برای دوست‌داشتنی بودن باید کاری انجام بدی یا خودتو به کسی ثابت کنی. تو همین‌جوری که هستی، برای من عزیزی، فقط به‌خاطر خودت. 🤍🫂"></p>
          <p data-text="من نمی‌گم همیشه بهترین آدم دنیا هستم یا هیچ‌وقت اشتباه نمی‌کنم. منم ممکنه یه وقتایی حرفی بزنم که ناراحتت کنه یا کاری کنم که دلت بگیره، ولی اگه یه روز همچین اتفاقی افتاد، بدون که ناراحت کردنت هیچ‌وقت چیزی نیست که بخوام. شاید همیشه بلد نباشم احساساتم رو درست نشون بدم، ولی هیچ‌وقت نمی‌خوام باعث بشم احساس کنی برام مهم نیستی. چون هستی خاهری، خیلی هم مهمی. من دلم می‌خواد اگه یه روز بینمون ناراحتی یا سوءتفاهمی پیش اومد، بتونیم با هم حرف بزنیم و نذاریم یه دلخوری کوچیک چیزی رو که برامون باارزشه خراب کنه. ❤️‍🩹"></p>
          <p data-text="راستش من نمی‌دونم آینده چی می‌شه یا زندگی قراره چه اتفاقایی برامون رقم بزنه، ولی دلم می‌خواد هر اتفاقی هم که افتاد، همیشه یه خاطره‌ی قشنگ از هم توی قلبمون داشته باشیم. دلم می‌خواد سال‌ها بعد که به این روزا نگاه می‌کنیم، با لبخند یاد هم بیفتیم و بگیم چقدر خوب شد که توی زندگی هم قرار گرفتیم. من دوست دارم خوشحالیت رو ببینم، موفق شدنت رو ببینم، رسیدنت به آرزوهات رو ببینم و بدونم که داری برای خودت یه زندگی قشنگ می‌سازی. حتی اگه نتونم همیشه کنارت باشم یا برای همه‌ی مشکلاتت راه‌حل داشته باشم، باز هم از ته قلبم برات بهترین‌ها رو می‌خوام. 🫂❤️"></p>
          <p data-text="خاهری قشنگم، اگه یه روزی احساس کردی هیچ‌کس درکت نمی‌کنه، اگه از چیزی ناراحت شدی یا دنیا اون‌جوری که می‌خواستی پیش نرفت، امیدوارم یادت بیاد که یه نفر هست که تو رو واقعاً خواهر خودش می‌دونه. یه نفر که خوشحالیت براش مهمه، که دوست داره ببینه حالت خوبه و از ته دل می‌خواد به چیزایی که آرزوشون رو داری برسی. من نمی‌خوام فقط با حرف بهت بگم که دوستت دارم؛ دلم می‌خواد توی رفتارم هم این دوست داشتن رو ببینی و بدونی که بودنت توی زندگیم برام بی‌ارزش و معمولی نیست."></p>
          <p data-text="تاج سرم، شاید آدمای زیادی توی زندگی بیان و برن، شاید با خیلیا آشنا بشیم و خاطرات زیادی بسازیم، ولی همه‌ی آدما نمی‌تونن جای خاصی که توی قلب آدم دارن رو بگیرن. تو برای من از اون آدمایی هستی که یه جوری به دلم نشستن که دیگه نمی‌تونم به چشم یه آدم معمولی بهشون نگاه کنم. من به داشتن خاهری مثل تو افتخار می‌کنم، چون چیزی که بین ما برای من ارزش داره، محبتیه که از ته قلبم نسبت بهت دارم. ❤️‍🩹"></p>
          <p data-text="یه وقتایی با خودم فکر می‌کنم چقدر قشنگه که آدم بتونه یه روزی به یکی بگه خاهری و واقعاً هم از ته دل منظورش همین باشه. من وقتی بهت می‌گم خاهری، فقط یه کلمه رو به زبون نمیارم؛ دارم از حسی حرف می‌زنم که واقعاً توی قلبمه. تو برای من یه آدم خاصی، یه آدمی که دلم می‌خواد همیشه خوشحال باشه، همیشه لبخند بزنه و هیچ‌وقت خودش رو تنها و بی‌ارزش ندونه."></p>
          <p data-text="شاید خیلی وقتا نتونم بهت بگم چقدر دوستت دارم، شاید گاهی حرفام اون‌جوری که توی دلمه از آب درنیاد، ولی تو هیچ‌وقت محبت منو با کم حرف زدنم اندازه نگیر. من شاید همیشه بلد نباشم قشنگ حرف بزنم، ولی احساسم بهت واقعیه. تو خاهری منی و من واقعاً از ته قلبم دوستت دارم. فقط به‌خاطر خودت، به‌خاطر شخصیتت و به‌خاطر جایگاهی که توی قلبم داری. 🤍"></p>
          <p data-text="ممنونم که هستی خاهری. ممنونم که وارد زندگیم شدی و تونستم تو رو به چشم یکی از عزیزترین آدمای زندگیم ببینم. شاید نتونم همه‌ی محبتت رو جبران کنم، شاید هیچ‌وقت نتونم با حرفام کامل نشون بدم که چقدر برام ارزش داری، ولی امیدوارم همیشه بدونی که بودنت برای من یه چیز معمولی نیست."></p>
          <p data-text="من از خدا می‌خوام همیشه دلت خوش باشه، تنت سالم باشه، غصه کمتر سراغت بیاد و به هر چیزی که از ته قلبت می‌خوای برسی. امیدوارم هیچ‌وقت مجبور نشی لبخند بزنی وقتی دلت گرفته، امیدوارم آدمای خوبی دور و برت باشن و امیدوارم زندگی اون‌قدر بهت قشنگی نشون بده که یادت بره روزای سخت هم وجود داشتن. تو لایق آرامشی، لایق خوشحالی‌ای و لایق تمام اتفاقای خوبی هستی که ممکنه توی این دنیا برات بیفته. ❤️🫂"></p>
          <p data-text="و در آخر، خاهری، تاج سرم، عزیز دلم... اگه قرار باشه فقط یه چیز از تموم این حرفا یادت بمونه، می‌خوام اون یه چیز این باشه که تو برای من واقعاً عزیزی. هیچ‌وقت لازم نیست برای من ثابت کنی که خاهری، چون من خیلی وقته تو رو توی قلبم به‌عنوان خواهرم پذیرفتم."></p>
          <p data-text="دوستت دارم خاهری، بیشتر از چیزی که بتونم با این چندتا جمله نشون بدم. امیدوارم همیشه بخندی، همیشه خوشحال باشی و همیشه بدونی که یه جای قشنگ توی قلب من داری. تو تاج سرمی، خواهر انتخابی قلبمی و یکی از عزیزترین آدمای زندگی منی. خدا تو رو برام حفظ کنه و دلت رو همیشه شاد نگه داره. ❤️‍🩹🫂🤍"></p>

<script>
  const envelope      = document.getElementById('envelope');
  const hint          = document.getElementById('hint');
  const modal         = document.getElementById('modal');
  const closeBtn      = document.getElementById('closeBtn');
  const particles     = document.getElementById('particles');
  const starsWrap     = document.getElementById('stars');
  const leavesBg      = document.getElementById('leavesBg');
  const butterfliesBg = document.getElementById('butterfliesBg');
  const cursorGlow    = document.getElementById('cursorGlow');
  const typedTitle    = document.getElementById('typedTitle');
  const letterBody    = document.getElementById('letterBody');
  const letterFooter  = document.getElementById('letterFooter');
  const soundWave     = document.getElementById('soundWave');

  const fullTitle = 'یه نامه برات دارم';
  let ti = 0;
  function typeTitle() {
    if (ti <= fullTitle.length) {
      typedTitle.innerHTML = fullTitle.slice(0, ti) + '<span class="caret"></span>';
      ti++;
      setTimeout(typeTitle, 110);
    } else {
      typedTitle.innerHTML = fullTitle + '<span class="caret"></span>';
      setTimeout(() => {
        const c = typedTitle.querySelector('.caret');
        if (c) { c.style.transition = 'opacity .5s'; c.style.opacity = '0'; }
        setTimeout(() => {
          if (c) c.remove();
          typedTitle.textContent = fullTitle;
        }, 500);
      }, 1400);
    }
  }
  setTimeout(typeTitle, 900);

  function spawnParticle() {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.bottom = '-10px';
    const size = 1 + Math.random() * 3;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    const dur = 8 + Math.random() * 10;
    p.style.animationDuration = dur + 's';
    p.style.animationDelay = (Math.random() * 2) + 's';
    const colors = ['#ff6b9d', '#ffc2d6', '#ffd77a', '#ff3d7f', '#fff'];
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.boxShadow = '0 0 6px currentColor, 0 0 14px currentColor';
    particles.appendChild(p);
    setTimeout(() => p.remove(), (dur + 3) * 1000);
  }
  setInterval(spawnParticle, 320);
  for (let i = 0; i < 20; i++) setTimeout(spawnParticle, i * 130);

  function createStars() {
    const count = window.innerWidth < 600 ? 40 : 80;
    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.top  = Math.random() * 100 + 'vh';
      s.style.animationDelay = (Math.random() * 3) + 's';
      s.style.animationDuration = (2 + Math.random() * 3) + 's';
      const sz = Math.random() * 2 + 1;
      s.style.width = sz + 'px';
      s.style.height = sz + 'px';
      starsWrap.appendChild(s);
    }
  }
  createStars();

  const leafEmojis = ['🌸', '🌹', '🌷', '💐', '🍂', '🍃', '🌸', '🌺', '💮', '🏵️'];
  function spawnLeaf() {
    const leaf = document.createElement('div');
    leaf.className = 'falling-leaf';
    leaf.textContent = leafEmojis[Math.floor(Math.random() * leafEmojis.length)];
    leaf.style.left = Math.random() * 100 + 'vw';
    const size = 16 + Math.random() * 22;
    leaf.style.fontSize = size + 'px';
    leaf.style.setProperty('--sway', (Math.random() * 100 - 50) + 'px');
    const dur = 9 + Math.random() * 8;
    leaf.style.animationDuration = dur + 's';
    leaf.style.animationDelay = (Math.random() * 3) + 's';
    if (Math.random() > 0.5) leaf.style.transform = `rotate(${Math.random() * 360}deg)`;
    leavesBg.appendChild(leaf);
    setTimeout(() => leaf.remove(), (dur + 4) * 1000);
  }
  setInterval(spawnLeaf, 700);
  for (let i = 0; i < 12; i++) setTimeout(spawnLeaf, i * 300);

  const butterflyEmojis = ['🦋', '🦋', '🦋', '🕊️'];
  function spawnButterfly() {
    const b = document.createElement('div');
    b.className = 'butterfly';
    b.textContent = butterflyEmojis[Math.floor(Math.random() * butterflyEmojis.length)];
    b.style.left = (Math.random() * 80 + 10) + 'vw';
    b.style.bottom = '-50px';
    b.style.fontSize = (14 + Math.random() * 12) + 'px';
    const dur = 12 + Math.random() * 8;
    b.style.animationDuration = dur + 's';
    b.style.animationDelay = (Math.random() * 4) + 's';
    butterfliesBg.appendChild(b);
    setTimeout(() => b.remove(), (dur + 5) * 1000);
  }
  setInterval(spawnButterfly, 2500);
  for (let i = 0; i < 3; i++) setTimeout(spawnButterfly, i * 1500);

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let glowX = mouseX, glowY = mouseY;
  document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX; mouseY = e.clientY;
  });
  function animateGlow() {
    glowX += (mouseX - glowX) * 0.08;
    glowY += (mouseY - glowY) * 0.08;
    cursorGlow.style.left = glowX + 'px';
    cursorGlow.style.top  = glowY + 'px';
    requestAnimationFrame(animateGlow);
  }
  animateGlow();
  if (window.matchMedia('(pointer: coarse)').matches) cursorGlow.style.display = 'none';

  const heartChars = ['❤', '💕', '💗', '🤍', '💖', '💘', '💝', '🌹', '🌸'];
  function burstHearts() {
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    for (let i = 0; i < 55; i++) {
      setTimeout(() => {
        const h = document.createElement('div');
        h.className = 'burst-heart';
        h.textContent = heartChars[Math.floor(Math.random() * heartChars.length)];
        h.style.left = cx + 'px';
        h.style.top  = cy + 'px';
        const angle = Math.random() * Math.PI * 2;
        const dist  = 150 + Math.random() * 420;
        h.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
        h.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
        h.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
        h.style.fontSize = (14 + Math.random() * 28) + 'px';
        h.style.color = ['#ff6b9d', '#ff3d7f', '#ffc2d6', '#ffd77a', '#fff'][Math.floor(Math.random() * 5)];
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 2000);
      }, i * 20);
    }
  }

  /* ═══════════════════════════════════════════════════════
     🎵🎻 موزیک فولوت + ویولون (نسخه تمیز و بدون خش‌خش)
     ═══════════════════════════════════════════════════════ */
  let audioCtx = null;
  let masterGain = null;
  let reverbGain = null;
  let musicPlaying = false;
  let musicTimers = [];
  let currentVolume = 0.22;

  const fluteMelody = [
    { f: 587.33, d: 1.6, v: 0.55 },
    { f: 698.46, d: 1.4, v: 0.6  },
    { f: 880.00, d: 2.2, v: 0.7  },
    { f: 783.99, d: 1.2, v: 0.55 },
    { f: 698.46, d: 1.8, v: 0.6  },
    { f: 587.33, d: 1.4, v: 0.5  },
    { f: 523.25, d: 1.2, v: 0.5  },
    { f: 698.46, d: 1.6, v: 0.65 },
    { f: 880.00, d: 2.4, v: 0.75 },
    { f: 1046.50, d: 2.6, v: 0.8 },
    { f: 880.00, d: 1.4, v: 0.6  },
    { f: 698.46, d: 1.6, v: 0.55 },
    { f: 587.33, d: 2.0, v: 0.55 },
    { f: 523.25, d: 2.8, v: 0.5  },
    { f: 587.33, d: 1.4, v: 0.5  },
    { f: 698.46, d: 1.6, v: 0.55 },
    { f: 880.00, d: 2.0, v: 0.6  },
    { f: 1046.50, d: 2.4, v: 0.7 },
    { f: 987.77, d: 1.4, v: 0.6  },
    { f: 880.00, d: 2.6, v: 0.55 },
  ];

  const violinPad = [
    { notes: [146.83, 220.00, 293.66], d: 6.0 },
    { notes: [174.61, 261.63, 349.23], d: 6.0 },
    { notes: [130.81, 196.00, 261.63], d: 6.0 },
    { notes: [146.83, 220.00, 293.66], d: 6.0 },
    { notes: [155.56, 233.08, 311.13], d: 6.0 },
    { notes: [174.61, 261.63, 349.23], d: 6.0 },
    { notes: [196.00, 293.66, 392.00], d: 6.0 },
    { notes: [146.83, 220.00, 293.66], d: 7.0 },
  ];

  /* ✅ Reverb نرم‌تر و کوتاه‌تر — بدون خش‌خش */
  function createReverb(ctx) {
    const convolver = ctx.createConvolver();
    const length = ctx.sampleRate * 1.5;
    const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const data = impulse.getChannelData(ch);
      for (let i = 0; i < length; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 3.5);
      }
    }
    convolver.buffer = impulse;
    return convolver;
  }

  /* ✅ فلوت تمیز و گرم */
  function playFluteNote(freq, duration, startTime, velocity) {
    const now = startTime;
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;

    const osc2 = audioCtx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = freq * 2;
    const osc2Gain = audioCtx.createGain();
    osc2Gain.gain.value = 0.04;

    const breath = audioCtx.createOscillator();
    breath.type = 'sine';
    breath.frequency.value = freq * 4;
    const breathGain = audioCtx.createGain();
    breathGain.gain.value = 0.006;

    const vibrato = audioCtx.createOscillator();
    vibrato.type = 'sine';
    vibrato.frequency.value = 4.2;
    const vibratoGain = audioCtx.createGain();
    vibratoGain.gain.value = freq * 0.002;
    vibrato.connect(vibratoGain);
    vibratoGain.connect(osc.frequency);

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1800, now);
    filter.frequency.exponentialRampToValueAtTime(1000, now + duration);
    filter.Q.value = 0.4;

    const gain = audioCtx.createGain();
    const peak = velocity * 0.07;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(peak, now + 0.12);
    gain.gain.linearRampToValueAtTime(peak * 0.85, now + duration * 0.4);
    gain.gain.linearRampToValueAtTime(peak * 0.6, now + duration * 0.85);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration + 0.3);

    osc.connect(filter);
    osc2.connect(osc2Gain);
    osc2Gain.connect(filter);
    breath.connect(breathGain);
    breathGain.connect(filter);
    filter.connect(gain);

    const panner = audioCtx.createStereoPanner();
    panner.pan.value = Math.sin(freq * 0.01) * 0.2;
    gain.connect(panner);
    panner.connect(masterGain);
    panner.connect(reverbGain);

    const endTime = now + duration + 0.35;
    osc.start(now); osc.stop(endTime);
    osc2.start(now); osc2.stop(endTime);
    breath.start(now); breath.stop(endTime);
    vibrato.start(now); vibrato.stop(endTime);
  }

  /* ✅ ویولون نرم و بدون نویز */
  function playViolinPad(notes, duration, startTime) {
    notes.forEach((freq) => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;

      const detune = audioCtx.createOscillator();
      detune.type = 'sine';
      detune.frequency.value = freq * 1.001;
      const detuneGain = audioCtx.createGain();
      detuneGain.gain.value = freq * 0.0015;
      detune.connect(detuneGain);
      detuneGain.connect(osc.frequency);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0, startTime);
      gain.gain.linearRampToValueAtTime(0.018, startTime + 2);
      gain.gain.linearRampToValueAtTime(0.015, startTime + duration * 0.6);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 500;
      filter.Q.value = 0.4;

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);
      gain.connect(reverbGain);

      osc.start(startTime);
      osc.stop(startTime + duration + 0.3);
      detune.start(startTime);
      detune.stop(startTime + duration + 0.3);
    });
  }

  /* ✅ Audio init با کمپرسور نرم */
  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    masterGain = audioCtx.createGain();
    masterGain.gain.value = currentVolume;

    const compressor = audioCtx.createDynamicsCompressor();
    compressor.threshold.value = -28;
    compressor.knee.value = 30;
    compressor.ratio.value = 6;
    compressor.attack.value = 0.01;
    compressor.release.value = 0.3;

    reverbGain = audioCtx.createGain();
    reverbGain.gain.value = 0.10;
    const convolver = createReverb(audioCtx);
    reverbGain.connect(convolver);
    convolver.connect(compressor);

    masterGain.connect(compressor);
    compressor.connect(audioCtx.destination);
  }

  function scheduleMusicLoop() {
    if (!audioCtx || !musicPlaying) return;
    let t = audioCtx.currentTime + 0.15;
    const melodyTotal = fluteMelody.reduce((s, n) => s + n.d, 0);

    let mt = t;
    fluteMelody.forEach((n) => {
      playFluteNote(n.f, n.d, mt, n.v);
      mt += n.d;
    });

    let ct = t;
    while (ct < mt) {
      violinPad.forEach((c) => {
        if (ct >= mt) return;
        playViolinPad(c.notes, Math.min(c.d, mt - ct), ct);
        ct += c.d;
      });
    }

    const timer = setTimeout(() => {
      if (musicPlaying) scheduleMusicLoop();
    }, (melodyTotal - 0.4) * 1000);
    musicTimers.push(timer);
  }

  function startMusic() {
    if (musicPlaying) return;
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    musicPlaying = true;
    soundWave.classList.add('active');
    scheduleMusicLoop();
  }

  function stopMusic() {
    if (!musicPlaying) return;
    musicPlaying = false;
    soundWave.classList.remove('active');
    musicTimers.forEach(t => clearTimeout(t));
    musicTimers = [];
    if (masterGain && audioCtx) {
      const g = masterGain.gain;
      g.cancelScheduledValues(audioCtx.currentTime);
      g.setValueAtTime(g.value, audioCtx.currentTime);
      g.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
      setTimeout(() => {
        if (masterGain && !musicPlaying) masterGain.gain.value = currentVolume;
      }, 600);
    }
  }

  document.addEventListener('visibilitychange', () => { if (document.hidden) stopMusic(); });
  window.addEventListener('pagehide', stopMusic);
  window.addEventListener('beforeunload', stopMusic);
  window.addEventListener('blur', stopMusic);

  let typingTimeouts = [];
  let typingAborted = false;
  let userScrolled = false;

  letterBody.addEventListener('scroll', () => {
    const isAtBottom = letterBody.scrollHeight - letterBody.scrollTop - letterBody.clientHeight < 30;
    if (!isAtBottom) userScrolled = true;
  });

  function typeAllParagraphs() {
    const paragraphs = letterBody.querySelectorAll('p');
    let totalDelay = 0;
    const CHAR_DELAY = 45;
    const PARA_PAUSE = 500;

    letterBody.scrollTop = 0;
    userScrolled = false;

    paragraphs.forEach((p) => {
      const text = p.getAttribute('data-text') || p.textContent;
      p.textContent = '';
      p.innerHTML = '<span class="typing-cursor"></span>';
      const startDelay = totalDelay;

      for (let i = 0; i < text.length; i++) {
        const t = setTimeout(() => {
          if (typingAborted) return;

          const cursor = p.querySelector('.typing-cursor');

          if (cursor) {
            cursor.insertAdjacentText('beforebegin', text[i]);
          } else {
            p.textContent += text[i];
          }
        }, startDelay + i * CHAR_DELAY);

        typingTimeouts.push(t);
      }

      const endT = setTimeout(() => {
        if (typingAborted) return;

        const cursor = p.querySelector('.typing-cursor');
        if (cursor) cursor.remove();
      }, startDelay + text.length * CHAR_DELAY);

      typingTimeouts.push(endT);

      totalDelay = startDelay + text.length * CHAR_DELAY + PARA_PAUSE;
    });

    const footerT = setTimeout(() => {
      if (typingAborted) return;
      letterFooter.classList.add('visible');
    }, totalDelay);

    typingTimeouts.push(footerT);
  }

  function abortTyping() {
    typingAborted = true;
    typingTimeouts.forEach(t => clearTimeout(t));
    typingTimeouts = [];
    const paragraphs = letterBody.querySelectorAll('p');
    paragraphs.forEach(p => {
      const text = p.getAttribute('data-text');
      if (text) p.textContent = text;
      const cursor = p.querySelector('.typing-cursor');
      if (cursor) cursor.remove();
    });
    letterFooter.classList.add('visible');
  }

  let opened = false;

  function openLetter(e) {
    if (e) e.stopPropagation();
    if (opened) return;
    opened = true;
    envelope.classList.add('open');
    hint.classList.add('hidden');

    startMusic();

    setTimeout(() => {
      modal.classList.add('show');
      burstHearts();

      letterBody.scrollTop = 0;
      userScrolled = false;

      setTimeout(() => {
        letterBody.scrollTop = 0;
        typingAborted = false;
        typeAllParagraphs();
      }, 500);
    }, 1100);
  }

  envelope.addEventListener('click', openLetter);
  envelope.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openLetter(e);
    }
  });

  function closeLetter(e) {
    if (e) e.stopPropagation();
    modal.classList.remove('show');
    abortTyping();
    letterFooter.classList.remove('visible');

    setTimeout(() => {
      envelope.classList.remove('open');
    }, 600);

    setTimeout(() => {
      hint.classList.remove('hidden');
      opened = false;
      letterBody.scrollTop = 0;
      userScrolled = false;
      const paragraphs = letterBody.querySelectorAll('p');
      paragraphs.forEach(p => {
        const text = p.getAttribute('data-text');
        if (text) p.textContent = '';
      });
    }, 1600);
  }

  closeBtn.addEventListener('click', closeLetter);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.classList.contains('show')) closeLetter(e);
  });
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeLetter(e);
  });

  if (!window.matchMedia('(pointer: coarse)').matches) {
    let lastSpawn = 0;
    document.addEventListener('mousemove', (e) => {
      const now = Date.now();
      if (now - lastSpawn < 70) return;
      lastSpawn = now;
      const s = document.createElement('div');
      s.style.position = 'fixed';
      s.style.left = e.clientX + 'px';
      s.style.top  = e.clientY + 'px';
      s.style.width = '2px';
      s.style.height = '2px';
      s.style.background = '#ff8fb0';
      s.style.boxShadow = '0 0 8px #ff6b9d';
      s.style.borderRadius = '50%';
      s.style.pointerEvents = 'none';
      s.style.zIndex = '5';
      s.style.transition = 'transform 1.2s ease-out, opacity 1.2s ease-out';
      document.body.appendChild(s);
      requestAnimationFrame(() => {
        s.style.transform = `translate(${(Math.random() - 0.5) * 80}px, ${(Math.random() - 0.5) * 80}px) scale(0)`;
        s.style.opacity = '0';
      });
      setTimeout(() => s.remove(), 1300);
    });
  }

  console.log('%c💌 یه نامه برات دارم - 🎵 فلوت + 🎻 ویولون (نسخه تمیز)', 'color:#ff6b9d; font-size:18px; font-weight:bold;');
</script>
